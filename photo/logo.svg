<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#BF953F"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="220" fill="#0f0f1a" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldStroke)" stroke-width="5"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>

  <!-- Буква N — строго по центру через dominant-baseline -->
  <text x="250" y="250" 
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="220" 
        font-weight="300" 
        fill="url(#goldText)" 
        text-anchor="middle" 
        dominant-baseline="central">
    N
  </text>
</svg>